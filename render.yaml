# Render Blueprint: one always-on web service plus a Postgres database, both in Singapore (closest to Jakarta).
# In Render: New + → Blueprint → pick this repo. You will be asked for GOOGLE_CLIENT_ID and INSTRUCTOR_EMAILS.
services:
  - type: web
    name: mitelab
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: INSTRUCTOR_EMAILS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mitelab-db
          property: connectionString

databases:
  - name: mitelab-db
    plan: basic-256mb
    region: singapore
    databaseName: mitelab
    user: mitelab
